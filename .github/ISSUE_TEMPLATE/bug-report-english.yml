name: "Bug Report (Custom)"
description: Create a detailed bug report to help us improve functionality and correctness.
title: "[BUG] - <title>"
labels: []
body:
  - type: input
    id: username
    attributes:
      label: "LeetCode Username"
      description: Provide your LeetCode username for reference.
    validations:
      required: true
  - type: input
    id: problem-details
    attributes:
      label: "Problem Details"
      placeholder: "E.g., Problem 2: Add Two Numbers (https://leetcode.com/problems/add-two-numbers/)"
    validations:
      required: true
  - type: dropdown
    id: bug-category
    attributes:
      label: "Bug Category"
      multiple: false
      options:
        - Problem Description
        - Problem Examples
        - Problem Constraints
        - Related Topics
        - Incorrect Test Case
        - Missing Test Case
        - Editorial
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: "Bug Description"
      description: Provide a clear and concise explanation of the bug.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: "Code Snippet"
      description: Include the code you used for submission or testing, if relevant.
    validations:
      required: false
  - type: dropdown
    id: language-used
    attributes:
      label: "Programming Language"
      options:
        - C++
        - Java
        - Python
        - JavaScript
        - TypeScript
        - Other
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: Describe the correct behavior expected from the problem or code.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: "Actual Behavior"
      description: Describe what happened instead of the expected behavior.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
      description: Include screenshots if applicable to illustrate the bug.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: Provide any additional information that might help resolve the issue.
    validations:
      required: false
