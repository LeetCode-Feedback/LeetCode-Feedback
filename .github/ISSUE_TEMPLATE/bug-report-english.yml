title: "[BUG] - Missing Test Case for Valid Parentheses Problem"
labels: []
body:
  - type: input
    id: username
    attributes:
      label: "LeetCode Username"
      description: Click your avatar in the top right on the problem page after logging in to find your username.
    validations:
      required: true
    value: "khatwangadarReddy"
  - type: input
    id: problem-details
    attributes:
      label: "Problem Number, Title, and Link"
      placeholder: 1. Two Sum https://leetcode.com/problems/two-sum/
    validations:
      required: true
    value: "Valid Parentheses https://leetcode.com/problems/valid-parentheses/"
  - type: dropdown
    id: bug-category
    attributes:
      label: "Bug Category"
      multiple: true
      options:
        - Problem description
        - Problem examples
        - Problem constraints
        - Problem hints
        - Incorrect or missing "Related Topics"
        - Incorrect test case *(Output of test case is incorrect as per the problem statement)*
        - Missing test case *(Incorrect/Inefficient Code getting accepted because of missing test cases)*
        - Editorial
    validations:
      required: true
    value:
      - Missing test case *(Incorrect/Inefficient Code getting accepted because of missing test cases)*
  - type: textarea
    id: bug-description
    attributes:
      label: "Bug Description"
      description: A clear and concise description of what the bug is.
    validations:
      required: true
    value: |
      The problem statement specifies that "Open brackets must be closed in the correct order." However, the test case "({)}" is not included in the test suite. Adding this test case would ensure that solutions adhere strictly to this rule.
      For instance:
      - "({)}" should return false because the open "{" is incorrectly closed by ")" instead of "}".

      Currently, incorrect or inefficient solutions might pass all tests because they are not tested against this case.
  - type: dropdown
    id: language-used
    attributes:
      label: "Language Used for Code"
      options:
        - C++
        - Java
        - Python/Python3
        - C
        - C#
        - JavaScript
        - TypeScript
        - PHP
        - Swift
        - Kotlin
        - Dart
        - Go
        - Ruby
        - Scala
        - Rust
        - Racket
        - Erlang
        - Elixir
        - MySQL
        - MSSQL
        - Oracle SQL
        - PostgreSQL
        - Pandas
        - Bash
    validations:
      required: false
    value: "Python3"
  - type: textarea
    id: code
    attributes:
      label: "Code used for Submit/Run operation"
      description: Please copy and paste the complete code you used for submit/run operation. This will be automatically formatted into code, so no need for backticks.
      render: bash
    validations:
      required: false
    value: |
      def isValid(s):
          stack = []
          mapping = {')': '(', '}': '{', ']': '['}
          for char in s:
              if char in mapping:
                  top_element = stack.pop() if stack else '#'
                  if mapping[char] != top_element:
                      return False
              else:
                  stack.append(char)
          return not stack
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected behavior"
      description: A clear and concise description of what was expected to happen in contrast with what happened.
    validations:
      required: true
    value: |
      Adding the test case "({)}" to the test suite should fail any solution that does not check for the correct order of closing brackets.

      Example outputs:
      - Input: "({)}"
      - Output: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to explain the issue.
    validations:
      required: false
    value: ""
  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: Add any other additional context about the bug.
    validations:
      required: false
    value: |
      Including this test case would help users better understand the rules of the problem and enforce stricter validations for solutions.
